name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # release uploads on tags

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, bin: construct.exe, asset: construct-windows-x64.exe }
          - { os: ubuntu-latest, bin: construct, asset: construct-linux-x64 }
          - { os: macos-latest, bin: construct, asset: construct-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      - run: pip install openai anthropic
      - run: python -m unittest -v # SDK wrap + real OpenAI/Anthropic SDKs through the proxy
      - run: python demo.py

      - name: release binary
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cargo build --release
          cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
          gh release create "$GITHUB_REF_NAME" --generate-notes || true  # first job wins; others upload
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" construct.py --clobber
